# =============================================================================================
#  standalone profile — zero external dependencies
#
#  Run with:  java -jar loomvault-server/target/loomvault.jar --spring.profiles.active=standalone
#  or:        mvn spring-boot:run -pl loomvault-server -Dspring-boot.run.profiles=standalone
#
#  Uses an in-memory H2 database and a process-local response cache, so no Docker is required.
#  The full JDBC persistence path is still exercised — only the database engine changes.
# =============================================================================================

spring:
  datasource:
    url: jdbc:h2:mem:loomvault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: loomvault-standalone
      maximum-pool-size: 6
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis is not part of standalone mode: the response cache is a process-local LRU (see
  # loomvault.cache.mode below). Excluding the autoconfiguration stops Spring from opening a
  # connection at all — without this, every startup printed a multi-frame
  # "Unable to connect to Redis ... Connection refused" stack trace that looked like a failure
  # but was only the health probe noticing there is no Redis to probe.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

loomvault:
  store:
    mode: jdbc
  cache:
    mode: memory
    max-entries: 500
  llm:
    provider: mock
    mock:
      # Snappier than the docker profile: this mode is used for interactive poking.
      min-latency: 40ms
      max-latency: 140ms
  engine:
    max-parallel-nodes: 4

# Belt and braces: even if the autoconfiguration exclusions above are ever relaxed, the health
# endpoint must not treat an unreachable Redis as a problem in a mode that does not use Redis.
management:
  health:
    redis:
      enabled: false

logging:
  level:
    io.loomvault: INFO
    org.flywaydb: WARN
